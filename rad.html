<!DOCTYPE html>

<style>

  --paper: #e7e1d3;

/* ------------------------------------------------ project page */

}

  width: 34px; height: 34px; border-radius: 50%; cursor: pointer;

}

  position: relative; display: flex; align-items: center; gap: 2.4vw;

}

@media (max-width: 900px) {
  .work { width: 30vw; }
  .p1 { top: 5%; left: 5%; }
  .p2 { top: 20%; left: 40%; }
  .p3 { top: 10%; left: 65%; }
  .p4 { top: 45%; left: 10%; }
  .p5 { top: 55%; left: 45%; width: 35vw; }

  .p3 { top: 10%; left: 55%; }

  .duo { font-size: 38px; }
  
  #detail { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .d-text { max-height: 44vh; padding: 3vh 5vw 2vh; gap: 1.4vh; }
  .d-title { font-size: 54px; }
  .d-desc p { font-size: 16px; }
  .d-strip { padding: 0 5vw; }
}
</style>
</head>
<body>

<svg class="grain" aria-hidden="true">
  <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .36  0 0 0 0 .33  0 0 0 0 .29  0 0 0 .6 0"/></filter>
  <rect width="100%" height="100%" filter="url(#n)"/>
</svg>

<header class="top">
  <h1 class="duo">RaD</h1>
  <p class="micro">previous projects<br><span id="count"></span></p>
</header>

<main class="scatter" id="wall"></main>

<footer class="foot"><span>RaD</span><span>previous projects</span></footer>

<section id="detail" aria-label="Project">
  <aside class="d-text">
    <a class="back" href="#/">&larr; all projects</a>
    <p class="d-no" id="d-no"></p>
    <h2 class="d-title" id="d-title"></h2>
    <p class="d-year" id="d-year"></p>
    <div class="d-desc" id="d-desc"></div>
    <div class="d-bar">
      <button id="prev" aria-label="Previous image">&larr;</button>
      <span class="d-count" id="d-count"></span>
      <button id="next" aria-label="Next image">&rarr;</button>
      <a class="d-next" id="d-nextlink" href="#/"></a>
    </div>
  </aside>
  <div class="d-strip" id="strip"></div>
</section>

<script>
/* ============================================================
   PROJECTS — edit text here. Images are found automatically:
   put files in /images named  {slug}_1, {slug}_2 ... {slug}_30
   (.jpg  .png  .mp4, lowercase, consecutive numbering from 1).
   ============================================================ */
const PROJECTS = [
  { slug:"spiral_spines", title:"Spiral Spines", year:"2026", subtitle:"", tone:"bw",
    text:[
      "A regenerative material practice that transforms uprooted and discarded timber into structural and spatial systems.",
      "Presented at the Climate Biennale Vienna 2026."
    ] },
  { slug:"woven_realities", title:"Woven Realities", year:"2025", subtitle:"Afghan House Pavilion", tone:"blue",
    text:[
      "The Woven Realities project understands human memory as an abstract yet fundamental architectural process. The aim is to translate these intimate dimensions of dwelling into a circular, 1:1-scale architectural prototype. Drawing primary inspiration from the traditional clay and mud-brick houses prevalent in Central Asia and globally, the project reinterprets these vernacular typologies for a European context. We achieve this by substituting traditional earth with locally sourced, reusable by-products from the construction, industry, and consumer waste sectors.",
      "By abstracting destroyed Afghan cultural monuments and reconstructing them using these reclaimed materials, we create a modular spatial structure. This transformation results in a low-tech, highly adaptable construction method that can be easily deployed, modified, and rebuilt virtually anywhere. It demonstrates how regenerative, low-carbon building approaches are not only ecologically necessary but also function as ritualistic techniques of enclosure, transforming mere “being in the world” into a profound sense of “being at home.”",
      "Material specifications: wood, cement, stone, fabric. Construction techniques: low-tech modular assembly, vernacular adaptation, kinetic base, deliberate omission. Dimensions: 666.5 × 322.5 × 263 cm."
    ] },
  { slug:"lifeguard_platform", title:"The Lifeguard Platform", year:"2026", subtitle:"", tone:"bw",
    text:[ "Set design / architectural installation." ] },
  { slug:"another_sea", title:"another sea behind another wall", year:"", subtitle:"", tone:"blue", text:[] },
  { slug:"soft_unsealing", title:"Soft Unsealing", year:"2024", subtitle:"IABR11 Rotterdam", tone:"bw",
    text:[
      "The goal of this project is to bring nature back to the city, revive the history, and fulfill the community wishes. This location, which initially had little function, is given a new purpose and stimulates further developments in the region.",
      "It began with applied research and experimental interventions by the [A]FA lab team, in dialogue with the community: “The core of the project is unlearning and experimenting with the ways we as architects are used to building. This is crucial to develop innovative spaces that promote socio-ecological transformation, improve local climate conditions, and create meaningful environments.”",
      "The research led to site-specific environmental interventions, such as relocating trees for natural shade and implementing rainwater harvesting systems to address overheating, water scarcity, and poor urban infrastructure."
    ] },
  { slug:"pay_cheque", title:"Pay-Cheque", year:"", subtitle:"", tone:"red", text:[] },
  { slug:"si_demain_je_pars", title:"si demain je pars", year:"", subtitle:"", tone:"blue", text:[] }
];

/* ---------------- automatic file detection ---------------- */
const MAX_MEDIA = 30;
const MEDIA_KINDS = [["jpg","image"],["png","image"],["mp4","video"]];

async function mediaExists(src, kind) {
  try {                                   // HEAD downloads nothing
    const r = await fetch(src, { method:"HEAD" });
    if (!r.ok) return false;
    const ct = (r.headers.get("content-type") || "").toLowerCase();
    return !ct || ct.startsWith(kind + "/");
  } catch (e) {                           // e.g. opened from disk (file://)
    return elementProbe(src, kind);
  }
}
function elementProbe(src, kind) {
  return new Promise(resolve => {
    let t; const done = ok => { clearTimeout(t); resolve(ok); };
    t = setTimeout(() => done(false), 6000);
    if (kind === "video") {
      const v = document.createElement("video"); v.preload = "metadata"; v.muted = true;
      v.onloadedmetadata = () => done(true); v.onerror = () => done(false); v.src = src;
    } else {
      const im = new Image(); im.onload = () => done(true); im.onerror = () => done(false); im.src = src;
    }
  });
}
async function findSlot(slug, n) {
  for (const [ext, kind] of MEDIA_KINDS) {
    const src = "images/" + slug + "_" + n + "." + ext;
    if (await mediaExists(src, kind)) return { src, type: kind };
  }
  return null;
}
// first image only (landing page) — 3 quick checks for projects with no files
const firstCache = {};
function getFirst(p) { return firstCache[p.slug] || (firstCache[p.slug] = findSlot(p.slug, 1)); }
// every file 1..30 (project page); stops at the first missing number
const allCache = {};
function getAll(p) {
  return allCache[p.slug] || (allCache[p.slug] = (async () => {
    const first = await getFirst(p);
    if (!first) return [];
    const found = [first]; let n = 2;
    while (n <= MAX_MEDIA) {
      const batch = [];
      for (let k = 0; k < 4 && n + k <= MAX_MEDIA; k++) batch.push(findSlot(p.slug, n + k));
      const res = await Promise.all(batch);
      let stop = false;
      for (const r of res) { if (!r) { stop = true; break; } found.push(r); }
      if (stop) break; n += 4;
    }
    return found;
  })());
}

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const GLYPHS = ["● ◆","★ ○","◆ ●","○ ★","● ○","◆ ★","★ ●"];

function mediaTag(item, alt, extra) {
  if (item.type === "video")
    return '<video ' + (extra||"") + ' src="' + item.src + '" autoplay muted loop playsinline></video>';
  return '<img ' + (extra||"") + ' src="' + item.src + '" alt="' + esc(alt) + '" decoding="async">';
}

/* ---------------- landing ---------------- */
function buildWall() {
  $("count").textContent = pad(PROJECTS.length) + " works";
  $("wall").innerHTML = PROJECTS.map((p, i) => `
    <a class="work p${i+1} tone-${p.tone}" href="#/${p.slug}" data-slug="${p.slug}">
      <div class="frame empty"><i class="ov ov-a"></i><i class="ov ov-b"></i></div>
      <div class="meta">
        <div class="meta-top">
          <span class="no">${pad(i+1)}</span>
          <span class="gl">${GLYPHS[i % GLYPHS.length]}</span>
          <span class="more">open &rarr;</span>
        </div>
        <span class="ttl">${esc(p.title)}</span>
        ${p.year ? '<span class="yr">' + esc(p.year) + '</span>' : ''}
      </div>
    </a>`).join("");
  PROJECTS.forEach(p => {
    getFirst(p).then(item => {
      if (!item) return;
      const frame = document.querySelector('.work[data-slug="' + p.slug + '"] .frame');
      frame.classList.remove("empty");
      frame.insertAdjacentHTML("afterbegin", mediaTag(item, p.title, 'loading="lazy"'));
    });
  });
}

/* ---------------- project page ---------------- */
const strip = $("strip");
let openToken = 0;

function openProject(slug) {
  const i = PROJECTS.findIndex(p => p.slug === slug);
  if (i < 0) { closeProject(); return; }
  const p = PROJECTS[i], nxt = PROJECTS[(i + 1) % PROJECTS.length];
  $("d-no").textContent = pad(i+1) + " / " + pad(PROJECTS.length);
  $("d-title").textContent = p.title;
  $("d-year").textContent = [p.subtitle, p.year].filter(Boolean).join("  ·  ");
  $("d-desc").innerHTML = p.text.map(t => "<p>" + esc(t) + "</p>").join("");
  $("d-nextlink").href = "#/" + nxt.slug;
  $("d-nextlink").innerHTML = "next: " + esc(nxt.title) + " &rarr;";
  $("d-count").textContent = "";
  strip.innerHTML = ""; strip.scrollLeft = 0;
  document.documentElement.classList.add("open");
  document.title = p.title + " — RaD";
  const token = ++openToken;
  getAll(p).then(items => {
    if (token !== openToken) return;
    if (!items.length) {
      strip.innerHTML = '<figure class="fig empty"><div class="m"></div><figcaption>images to come</figcaption></figure>';
      $("d-count").textContent = "";
      return;
    }
    strip.innerHTML = items.map((it, k) =>
      '<figure class="fig"><div class="m">' + mediaTag(it, p.title + " — Fig. " + (k+1), 'loading="lazy"') +
      '</div><figcaption>Fig. ' + (k+1) + '</figcaption></figure>').join("");
    strip.querySelectorAll(".fig img, .fig video").forEach(watchFit);
    updateCount();
  });
}
function closeProject() {
  openToken++;
  document.documentElement.classList.remove("open");
  document.title = "RaD — previous projects";
  strip.innerHTML = "";
}

/* size each figure to its own file: true proportions, as large as the strip allows */
function fit(el) {
  const nw = el.naturalWidth || el.videoWidth, nh = el.naturalHeight || el.videoHeight;
  if (!nw || !nh) return;
  const small = window.innerWidth <= 760;
  const maxH = strip.clientHeight * (small ? 0.80 : 0.86) - 28;
  const maxW = strip.clientWidth * (small ? 0.86 : 0.72);
  const k = Math.min(maxW / nw, maxH / nh);
  const m = el.parentElement;
  m.style.width = Math.round(nw * k) + "px";
  m.style.height = Math.round(nh * k) + "px";
}
function watchFit(el) {
  const ev = el.tagName === "VIDEO" ? "loadedmetadata" : "load";
  el.addEventListener(ev, () => { fit(el); updateCount(); });
  if ((el.complete && el.naturalWidth) || el.readyState >= 1) fit(el);
}
window.addEventListener("resize", () => strip.querySelectorAll(".fig:not(.empty) img, .fig:not(.empty) video").forEach(fit));

/* current image = the one nearest the middle of the strip */
function figs() { return [...strip.querySelectorAll(".fig:not(.empty)")]; }
function currentIndex() {
  const f = figs(); if (!f.length) return -1;
  const mid = strip.scrollLeft + strip.clientWidth / 2; let best = 0, bd = Infinity;
  f.forEach((el, k) => { const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = k; } });
  return best;
}
function updateCount() {
  const f = figs(); if (!f.length) { $("d-count").textContent = ""; return; }
  $("d-count").textContent = (currentIndex() + 1) + " / " + f.length;
}
function goTo(k) {
  const f = figs(); if (!f.length) return;
  k = Math.max(0, Math.min(f.length - 1, k));
  strip.scrollTo({ left: f[k].offsetLeft - (strip.clientWidth - f[k].offsetWidth) / 2, behavior: "smooth" });
}
let raf = 0;
strip.addEventListener("scroll", () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(updateCount); }, { passive: true });
// mouse wheel / trackpad scrolls the images back and forth
strip.addEventListener("wheel", e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { strip.scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive: false });
$("prev").addEventListener("click", () => goTo(currentIndex() - 1));
$("next").addEventListener("click", () => goTo(currentIndex() + 1));
document.addEventListener("keydown", e => {
  if (!document.documentElement.classList.contains("open")) return;
  if (e.key === "ArrowRight") goTo(currentIndex() + 1);
  else if (e.key === "ArrowLeft") goTo(currentIndex() - 1);
  else if (e.key === "Escape") location.hash = "#/";
});

/* ---------------- routing (#/slug) ---------------- */
function route() {
  const m = location.hash.match(/^#\/(.+)$/);
  if (m) openProject(decodeURIComponent(m[1])); else closeProject();
}
window.addEventListener("hashchange", route);
buildWall();
route();
</script>
</body>
</html>
